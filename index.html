<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phương Ngọc Anh · Bằng lái A1 🛵</title>
<meta name="theme-color" content="#14212E">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bằng A1 🛵">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDFCF8; --surface:#FFFFFF; --ink:#14212E; --ink2:#4A5866; --mute:#68727D;
  --line:#E5E2DA; --asphalt:#22323F;
  --red:#C8102E; --jade:#0E7A57; --saffron:#E9930B; --sky:#1668C2;
  --pad:18px; --r:16px;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
     -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.wrap{max-width:660px;margin:0 auto;
      padding:0 calc(var(--pad) + env(safe-area-inset-left)) 0 calc(var(--pad) + env(safe-area-inset-right))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.022em;line-height:1.15}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:no-preference){
  .card,.opt,.dot,.btn{transition:transform .14s cubic-bezier(.2,.8,.3,1),border-color .14s,background .14s}
  .fade{animation:fade .2s ease both}
}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.lane{height:6px;border-radius:3px;background:var(--asphalt);
      -webkit-mask:repeating-linear-gradient(90deg,#000 0 22px,transparent 22px 36px);
              mask:repeating-linear-gradient(90deg,#000 0 22px,transparent 22px 36px);
      opacity:.16;margin:22px 0}

.top{position:sticky;top:0;z-index:30;background:rgba(253,252,248,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
     border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .row{display:flex;align-items:center;gap:12px;height:58px}
.back{font-size:20px;width:38px;height:38px;display:grid;place-items:center;margin-left:-9px;border-radius:10px}
.back:active{background:var(--line)}
.top h2{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;
       background:var(--asphalt);color:#fff;padding:6px 11px;border-radius:9px}
.clock.low{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.62}}
.pbar{height:3px;background:var(--line)}
.pbar i{display:block;height:100%;background:var(--sky);width:0;transition:width .25s}

.hero{padding:34px 0 4px}
.hero .who{font-size:15px;color:var(--ink2);margin:14px 0 0}
.goal{margin-top:18px;background:var(--surface);border:1px solid var(--line);
      border-radius:var(--r);padding:16px 17px}
.goal__top{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--ink2)}
.goal__top b{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--ink)}
.goal__bar{height:9px;background:var(--line);border-radius:5px;margin-top:11px;overflow:hidden}
.goal__bar i{display:block;height:100%;border-radius:5px;transition:width .45s cubic-bezier(.2,.8,.3,1);
             background:linear-gradient(90deg,var(--jade),#3FB98A)}
.goal__msg{margin-top:10px;font-size:13px;color:var(--muted)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:600;
         letter-spacing:.16em;text-transform:uppercase;color:var(--red);
         border:1.5px solid var(--red);border-radius:99px;padding:5px 12px}
.hero h1{font-size:clamp(25px,6.8vw,38px);margin:16px 0 12px;text-wrap:balance;word-break:keep-all}
.hero h1 .nm{color:var(--jade)}
.hero p{margin:0;color:var(--ink2);font-size:14.5px}
.hero b{font-family:var(--mono);font-weight:600;color:var(--ink)}

.grid{display:grid;gap:13px;padding-bottom:34px}
.card{position:relative;display:block;width:100%;background:var(--surface);border:1px solid var(--line);
      border-radius:var(--r);padding:19px 19px 19px 21px;overflow:hidden;box-shadow:0 1px 2px rgba(20,33,46,.04)}
.card:active{transform:scale(.985)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.card .t{font-size:19px;font-weight:800}
.card .d{color:var(--ink2);font-size:13.5px;margin-top:5px;line-height:1.45}
.card .n{position:absolute;right:19px;top:19px;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--mute)}
.card.dark{background:var(--asphalt);border-color:var(--asphalt);color:#fff}
.card.dark::before{background:var(--sky)}
.card.dark .d{color:#AEBBC7} .card.dark .n{color:#8FA0AF}
.card.crit::before{background:var(--red)} .card.crit .t{color:var(--red)}
.card.rev::before{background:var(--saffron)}
.card.book::before{background:var(--jade)}
.card.resume{background:#FFF8E8;border-color:var(--saffron)}
.card.resume::before{background:var(--saffron)}
.meter{height:5px;background:var(--line);border-radius:3px;margin-top:13px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--jade);border-radius:3px;transition:width .3s}

.a2hs{background:var(--asphalt);color:#fff;border-radius:14px;padding:16px 17px;margin:18px 0 0;font-size:13.5px;line-height:1.5}
.a2hs b{display:block;font-size:15px;margin-bottom:5px}
.a2hs button{margin-top:11px;font-size:13px;font-weight:700;color:#AEBBC7;text-decoration:underline}

.qhead{display:flex;align-items:center;gap:7px;margin:22px 0 12px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.05em;
      border:1.5px solid var(--line);color:var(--ink2);border-radius:99px;padding:4px 10px}
.chip.red{background:var(--red);border-color:var(--red);color:#fff}
.qtext{font-size:19.5px;font-weight:700;line-height:1.45;margin:0 0 16px;letter-spacing:-.012em}
.figure{display:block;width:100%;background:#fff;border:1px solid var(--line);
         border-radius:13px;padding:9px;margin-bottom:16px}
.figure img{width:100%;display:block;border-radius:7px}
.figure{position:relative;cursor:zoom-in}
.figure::after{content:'⤢ chạm để phóng to';position:absolute;right:14px;bottom:14px;
  background:rgba(20,33,46,.72);color:#fff;font-size:11px;padding:4px 9px;border-radius:99px;pointer-events:none}
.zoom{position:fixed;inset:0;z-index:90;background:rgba(10,16,22,.94);display:grid;place-items:center;padding:14px}
.zoom img{max-width:100%;max-height:88vh;border-radius:10px;background:#fff}
.zoom button{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:26px;line-height:1}
.opts{display:grid;gap:11px}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;background:var(--surface);min-height:56px;
     border:1.8px solid var(--line);border-radius:13px;padding:16px 15px;font-size:15.5px;line-height:1.45}
.opt:active{transform:scale(.99)}
.opt .k{flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
        font-family:var(--mono);font-size:13px;font-weight:600;background:var(--line);color:var(--ink2);margin-top:1px}
.opt.sel{border-color:var(--sky);background:#F2F8FF}
.opt.sel .k{background:var(--sky);color:#fff}
.opt.right{border-color:var(--jade);background:#EDF8F3}
.opt.right .k{background:var(--jade);color:#fff}
.opt.wrong{border-color:var(--red);background:#FDF1F3}
.opt.wrong .k{background:var(--red);color:#fff}
.verdict{margin-top:15px;padding:14px 16px;border-radius:13px;font-size:14.5px;font-weight:700;
         display:flex;gap:10px;align-items:center}
.verdict.y{background:#EDF8F3;color:var(--jade)}
.verdict.n{background:#FDF1F3;color:var(--red)}
.verdict.o{background:#FFF8E8;color:#8A6200}
.verdict .ico{font-size:17px}
.explain{margin-top:12px;background:#F4F2ED;border-left:4px solid var(--asphalt);
         border-radius:0 12px 12px 0;padding:14px 16px;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.explain b{display:block;font-size:11.5px;font-family:var(--mono);letter-spacing:.12em;
           color:var(--asphalt);margin-bottom:6px}
.chip.alt{border-style:dashed;color:var(--mute)}

.navbar{position:sticky;bottom:0;z-index:20;background:rgba(253,252,248,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
        border-top:1px solid var(--line);padding:11px 0 max(11px,env(safe-area-inset-bottom))}
.navbar .row{display:flex;gap:10px}
.btn{flex:1;border:1.8px solid var(--line);background:var(--surface);border-radius:13px;padding:17px 15px;
     font-weight:700;font-size:15.5px;text-align:center}
.btn:active{transform:scale(.985)}
.btn.go{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.fin{background:var(--jade);border-color:var(--jade);color:#fff}
.btn[disabled]{opacity:.35;pointer-events:none}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:22px 0 8px}
.dot{position:relative;aspect-ratio:1;border:1.8px solid var(--line);border-radius:11px;background:var(--surface);
     font-family:var(--mono);font-size:13px;font-weight:600;display:grid;place-items:center}
.dot.done{background:var(--asphalt);color:#fff;border-color:var(--asphalt)}
.dot.now{border-color:var(--sky);border-width:3px}
.dot.crit::after{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--red)}

.score{text-align:center;padding:36px 0 8px}
.badge{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.1em;padding:7px 18px;border-radius:99px}
.pass .badge{background:var(--jade);color:#fff} .fail .badge{background:var(--red);color:#fff}
.score .big{font-family:var(--mono);font-weight:600;font-size:76px;line-height:1.05;margin-top:16px}
.score .big span{font-size:28px;color:var(--mute)}
.score .sub{color:var(--ink2);font-size:14.5px;margin-top:10px;padding:0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin:22px 0 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 12px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600}
.stat span{font-size:11.5px;color:var(--mute);letter-spacing:.03em}

.empty{padding:60px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:7px}
.err{border:1.8px solid var(--red);background:#FDF1F3;border-radius:14px;padding:18px;font-size:14.5px;margin-top:30px}
.err code{font-family:var(--mono);font-size:13px}
</style>
</head>
<body>

<header class="top" id="top" hidden>
  <div class="wrap"><div class="row">
    <button class="back" id="back" aria-label="Quay lại">←</button>
    <h2 id="title"></h2>
    <span class="clock" id="clock" role="timer" aria-live="off" hidden></span>
  </div></div>
  <div class="pbar"><i id="pbar"></i></div>
</header>

<main id="view"></main>
<nav class="navbar" id="nav" hidden><div class="wrap"><div class="row" id="navInner"></div></div></nav>

<script>
const mem={};
const store={
  get(k){try{const v=localStorage.getItem(k);return v===null?(mem[k]??null):JSON.parse(v)}catch{return mem[k]??null}},
  set(k,v){mem[k]=v;try{v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const CH={
  1:{name:'Quy định chung & quy tắc giao thông',pick:8},
  2:{name:'Văn hóa giao thông, đạo đức lái xe',pick:1},
  3:{name:'Kỹ thuật lái xe & cấu tạo sửa chữa',pick:1},
  4:{name:'Báo hiệu đường bộ',pick:8},
  5:{name:'Sa hình & xử lý tình huống',pick:6}
};
const NAME = 'Phương Ngọc Anh';   // ← 여기만 바꾸면 화면 전체에 반영됨
const EXAM={n:25,pass:21,minutes:19}, EXKEY='exam_v1';
const cheer = p =>
  p===0   ? 'Bắt đầu từ 20 câu điểm liệt nhé — quan trọng nhất đấy 💪' :
  p<25    ? 'Khởi động tốt rồi! Mỗi ngày một chút thôi 🌱' :
  p<50    ? 'Được gần một phần tư chặng đường rồi đó 🚀' :
  p<75    ? 'Quá nửa rồi! Cố lên nhé ✨' :
  p<100   ? 'Sắp xong rồi, chạy nước rút thôi 🔥' :
            'Thuộc hết 252 câu rồi! Đi thi thôi 🎉';
let QS=[],BY={};
const S={screen:'home',exam:null,study:null,timer:null,wake:null};

const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const setOf=k=>new Set(store.get(k)||[]);
const mark=(k,id,on)=>{const s=setOf(k);on?s.add(id):s.delete(id);store.set(k,[...s])};
const record=(id,ok)=>{mark('wrong',id,!ok);mark('learned',id,ok)};
const mmss=t=>String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');

/* ── 부팅 ── */
async function boot(){
  try{
    const r=await fetch('questions.json',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    QS=(d.questions||[]).filter(q=>q&&q.text&&Array.isArray(q.options)&&q.answer);
    if(!QS.length)throw new Error('Bộ câu hỏi trống');
    const bad=[], seen=new Set();
    QS.forEach(q=>{
      if(seen.has(q.id))bad.push('trùng id '+q.id); else seen.add(q.id);
      if(!Number.isInteger(q.answer)||q.answer<1||q.answer>q.options.length)
        bad.push('đáp án sai ở câu '+q.id);
      if(q.options.length<2)bad.push('thiếu lựa chọn ở câu '+q.id);
    });
    if(bad.length)throw new Error('Dữ liệu lỗi: '+bad.slice(0,5).join(', '));
    QS.forEach(q=>BY[q.id]=q);
    home();
  }catch(e){
    $('view').innerHTML=`<div class="wrap"><div class="err"><b>Chưa tải được bộ câu hỏi.</b><br>
      Kiểm tra kết nối mạng rồi tải lại trang.<br><br><code>${esc(e.message||e)}</code></div></div>`;
  }
}
function chrome(t,{clock=false,prog=null}={}){
  $('top').hidden=false;$('title').textContent=t;$('clock').hidden=!clock;
  $('pbar').style.width=prog==null?'0%':(prog*100)+'%';
}
function nav(h){const n=$('nav');if(!h){n.hidden=true;return}n.hidden=false;$('navInner').innerHTML=h}
function view(h){
  document.querySelectorAll('.zoom').forEach(z=>z.remove());
  $('view').innerHTML=`<div class="wrap fade">${h}</div>`;
  const top=$('top');
  if(!top.hidden && scrollY>0) scrollTo({top:0,behavior:'instant'});
}

/* ── 홈 ── */
function savedExam(){
  const s=store.get(EXKEY);
  if(!s||!Array.isArray(s.ids)||typeof s.endAt!=='number')return null;
  if(s.endAt-Date.now()<5000)  {store.set(EXKEY,null);return null}
  const paper=s.ids.map(id=>BY[id]).filter(Boolean);
  if(paper.length!==s.ids.length||paper.length!==EXAM.n){store.set(EXKEY,null);return null}
  const ok=new Set(paper.map(q=>q.id)), ans={};
  for(const[k,v]of Object.entries(s.ans||{})){
    const id=+k, q=BY[id];
    if(ok.has(id)&&Number.isInteger(v)&&v>=1&&v<=q.options.length)ans[id]=v;
  }
  const i=Math.min(Math.max(0,Number(s.i)||0),EXAM.n-1);
  return {paper,ans,i,endAt:s.endAt,done:false};
}
function home(){
  S.screen='home';stopTimer();wake(false);$('top').hidden=true;nav('');
  const learned=setOf('learned'),wrong=setOf('wrong');
  const crit=QS.filter(q=>q.critical), critDone=crit.filter(q=>learned.has(q.id)).length;
  const pct=Math.round(learned.size/QS.length*100);
  const res=savedExam();
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  view(`
    <section class="hero">
      <span class="eyebrow">🛵 Dự án lấy bằng A1</span>
      <h1><span class="nm">${NAME}</span> ơi,<br>mình cùng đậu nhé!</h1>
      <p class="who">Đề thi <b>25</b> câu trong <b>19</b> phút · đạt <b>21/25</b> và không sai câu điểm liệt</p>
      <div class="goal">
        <div class="goal__top"><span>Đã thuộc <b>${learned.size}</b> / ${QS.length} câu</span><b>${pct}%</b></div>
        <div class="goal__bar"><i style="width:${pct}%"></i></div>
        <div class="goal__msg">${cheer(pct)}</div>
      </div>
    </section>
    <div class="lane"></div>
    <div class="grid">
      ${res?`<button class="card resume" data-go="resume">
        <span class="n">${mmss(Math.round((res.endAt-Date.now())/1000))}</span>
        <div class="t">Tiếp tục bài thi</div>
        <div class="d">Bài thi đang dở vẫn còn thời gian — đã trả lời ${Object.keys(res.ans).length}/${EXAM.n} câu</div></button>`:''}

      <button class="card dark" data-go="exam"><span class="n">19 phút</span>
        <div class="t">Thi thử</div>
        <div class="d">Đề ngẫu nhiên đúng cấu trúc thi thật, có bấm giờ và chấm điểm</div></button>

      <button class="card crit" data-go="crit"><span class="n">${critDone}/${crit.length}</span>
        <div class="t">Câu điểm liệt</div>
        <div class="d">Sai một câu là trượt ngay — học kỹ nhóm này trước tiên</div>
        <div class="meter"><i style="width:${crit.length?critDone/crit.length*100:0}%"></i></div></button>

      <button class="card book" data-go="study"><span class="n">${pct}%</span>
        <div class="t">Học theo chương</div>
        <div class="d">${QS.length} câu, xem đáp án ngay sau khi chọn</div>
        <div class="meter"><i style="width:${pct}%"></i></div></button>

      <button class="card rev" data-go="wrong"><span class="n">${wrong.size}</span>
        <div class="t">Câu đã làm sai</div>
        <div class="d">${wrong.size?'Làm lại tới khi đúng thì câu đó tự rời khỏi đây':'Chưa có câu nào — thử một đề đi'}</div></button>
    </div>
    ${(ios&&!standalone&&!store.get('a2hs'))?`<div class="a2hs" id="a2hs">
      <b>Nên thêm vào Màn hình chính</b>
      Mở bằng Safari · bấm nút Chia sẻ <span aria-hidden="true">􀈂</span> · chọn <b style="display:inline">Thêm vào MH chính</b>.
      Mở trong Safari thường, nếu 7 ngày không vào thì iPhone sẽ tự xoá tiến độ học. Thêm vào Màn hình chính thì không bị xoá.
      <button id="a2hsx">Đã hiểu, ẩn thông báo này</button></div>`:''}`);
  $('view').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.go;
    if(g==='resume')resumeExam();
    if(g==='exam'){if(res&&!confirm('Bài thi đang dở sẽ bị huỷ. Bắt đầu đề mới?'))return;startExam()}
    if(g==='crit')startStudy(QS.filter(q=>q.critical),'Câu điểm liệt');
    if(g==='study')chapters();
    if(g==='wrong'){const w=setOf('wrong');startStudy(QS.filter(q=>w.has(q.id)),'Câu đã làm sai')}
  });
  if($('a2hsx'))$('a2hsx').onclick=()=>{store.set('a2hs',1);$('a2hs').remove()};
}
function chapters(){
  S.screen='chapters';chrome('Học theo chương');nav('');
  const learned=setOf('learned');
  view('<div class="grid" style="padding-top:22px">'+Object.entries(CH).map(([k,v])=>{
    const list=QS.filter(q=>String(q.chapter)===k), done=list.filter(q=>learned.has(q.id)).length;
    return `<button class="card book" data-ch="${k}"><span class="n">${done}/${list.length}</span>
      <div class="t">Chương ${k}</div><div class="d">${v.name}</div>
      <div class="meter"><i style="width:${list.length?done/list.length*100:0}%"></i></div></button>`;
  }).join('')+'</div>');
  $('view').querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>
    startStudy(QS.filter(q=>String(q.chapter)===b.dataset.ch),'Chương '+b.dataset.ch));
}

/* ── 학습 / 복습 ── */
function startStudy(list,title,picks){
  S.screen='study';
  if(!list.length){chrome(title);nav('');
    view('<div class="empty"><b>Không có câu nào ở đây.</b>Quay lại trang chính và chọn mục khác.</div>');return}
  S.study={list,i:0,title,picks:picks?{...picks}:{},review:!!picks};
  drawStudy();
}
function drawStudy(){
  const st=S.study,q=st.list[st.i],picked=st.picks[q.id]||null;
  chrome(`${st.title} · ${st.i+1}/${st.list.length}`,{prog:(st.i+1)/st.list.length});
  view(qHTML(q,picked,st.review?'review':(picked?'reveal':'ask')));
  if(!st.review&&!picked)$('view').querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    st.picks[q.id]=+o.dataset.i;record(q.id,st.picks[q.id]===q.answer);drawStudy();
  });
  const nx=st.list[st.i+1];if(nx&&nx.image)new Image().src=nx.image;
  const last=st.i===st.list.length-1;
  nav(`<button class="btn" id="prev" ${st.i?'':'disabled'}>Câu trước</button>
       <button class="btn go" id="next">${last?'Hoàn thành':'Câu sau'}</button>`);
  $('prev').onclick=()=>{st.i--;drawStudy()};
  $('next').onclick=()=>{if(last)return home();st.i++;drawStudy()};
}
function qHTML(q,picked,mode){
  const reveal=mode==='reveal'||mode==='review';
  const opts=q.options.map((t,x)=>{
    const i=x+1;let c='opt';
    if(reveal&&i===q.answer)c+=' right';
    else if(picked===i)c+=reveal?' wrong':' sel';
    const lab=reveal?(i===q.answer?'Đáp án đúng. ':(picked===i?'Bạn đã chọn. ':'')):'';
    return `<button class="${c}" data-i="${i}" aria-label="${esc(lab)}Ý ${i}: ${esc(t)}">
            <span class="k" aria-hidden="true">${i}</span><span>${esc(t)}</span></button>`;
  }).join('');
  let v='';
  if(reveal){
    if(!picked)v=`<div class="verdict o" role="status"><span class="ico">!</span><span>Bạn đã bỏ trống câu này — đáp án đúng là ý ${q.answer}</span></div>`;
    else if(picked===q.answer)v=`<div class="verdict y" role="status"><span class="ico">✓</span><span>Chính xác</span></div>`;
    else v=`<div class="verdict n" role="status"><span class="ico">✕</span><span>Bạn chọn ý ${picked} — đáp án đúng là ý ${q.answer}</span></div>`;
  }
  const ex=(reveal&&q.explain)
    ? `<div class="explain"><b>GIẢI THÍCH</b>${esc(q.explain)}</div>` : '';
  return `<div class="qhead"><span class="chip">Câu ${q.id}</span>
            ${q.critical?'<span class="chip red">ĐIỂM LIỆT</span>':''}
            ${q.only_in?'<span class="chip alt">Câu bổ sung</span>':''}</div>
          <p class="qtext">${esc(q.text)}</p>
          ${q.image?`<button type="button" class="figure" aria-label="Hình của câu ${q.id} — chạm để phóng to">
              <img src="${esc(q.image)}" alt="Hình minh hoạ của câu ${q.id}"></button>`:''}
          <div class="opts" role="group">${opts}</div>${v}${ex}`;
}

/* ── 시험 ── */
function buildPaper(){
  const crit=shuffle(QS.filter(q=>q.critical)).slice(0,1);
  const used=new Set(crit.map(q=>q.id));const paper=[...crit];
  for(const[k,v]of Object.entries(CH))
    for(const q of shuffle(QS.filter(q=>String(q.chapter)===k&&!used.has(q.id))).slice(0,v.pick)){paper.push(q);used.add(q.id)}
  const rest=shuffle(QS.filter(q=>!used.has(q.id)));
  while(paper.length<EXAM.n&&rest.length)paper.push(rest.pop());
  return shuffle(paper).slice(0,EXAM.n);
}
const left=()=>S.exam?Math.max(0,Math.round((S.exam.endAt-Date.now())/1000)):0;
function saveExam(){
  if(!S.exam||S.exam.done)return;
  store.set(EXKEY,{ids:S.exam.paper.map(q=>q.id),ans:S.exam.ans,i:S.exam.i,endAt:S.exam.endAt});
}
function startExam(){
  stopTimer();
  S.exam={paper:buildPaper(),ans:{},i:0,endAt:Date.now()+EXAM.minutes*60000,done:false,lock:false};
  runExam();
}
function resumeExam(){const e=savedExam();if(!e)return home();stopTimer();S.exam={...e,lock:false};runExam()}
function runExam(){
  S.screen='exam';saveExam();drawExam();tick();wake(true);
  S.timer=setInterval(()=>{left()<=0?finish():tick()},500);
}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null}}
function tick(){const t=left(),c=$('clock');c.textContent=mmss(t);c.classList.toggle('low',t<=120)}
function drawExam(){
  const e=S.exam,q=e.paper[e.i],n=Object.keys(e.ans).length;
  chrome(`Câu ${e.i+1} / ${EXAM.n}`,{clock:true,prog:n/EXAM.n});tick();
  view(qHTML(q,e.ans[q.id]||null,'ask')+dots());
  $('view').querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    if(e.lock)return;
    const first=!e.ans[q.id];
    e.ans[q.id]=+o.dataset.i;saveExam();drawExam();
    if(first&&e.i<EXAM.n-1){
      const from=e.i; e.lock=true;
      setTimeout(()=>{
        e.lock=false;
        // 그 사이 스와이프·번호·다음 버튼으로 이미 이동했다면 넘기지 않는다
        if(S.screen==='exam'&&!e.done&&e.i===from&&e.i<EXAM.n-1){e.i++;saveExam();drawExam()}
      },450);
    }
  });
  $('view').querySelectorAll('.dot').forEach(d=>d.onclick=()=>{e.i=+d.dataset.n;saveExam();drawExam()});
  const nx=e.paper[e.i+1];if(nx&&nx.image)new Image().src=nx.image;
  nav(`<button class="btn" id="prev" ${e.i?'':'disabled'}>Trước</button>
       ${(n===EXAM.n||e.i===EXAM.n-1)
         ?`<button class="btn fin" id="fin">Nộp bài · ${n}/${EXAM.n}</button>`
         :`<button class="btn go" id="next">Sau</button>`}`);
  if($('prev'))$('prev').onclick=()=>{e.i--;saveExam();drawExam()};
  if($('next'))$('next').onclick=()=>{e.i++;saveExam();drawExam()};
  if($('fin'))$('fin').onclick=()=>{
    const miss=EXAM.n-n;
    if(!confirm(miss?`Còn ${miss} câu chưa trả lời. Nộp bài luôn?`:'Nộp bài bây giờ?'))return;
    finish();
  };
}
function dots(){
  const e=S.exam;
  return '<div class="dots" role="group" aria-label="Danh sách câu hỏi">'+e.paper.map((q,n)=>{
    let c='dot';if(e.ans[q.id])c+=' done';if(n===e.i)c+=' now';if(q.critical)c+=' crit';
    return `<button class="${c}" data-n="${n}" ${n===e.i?'aria-current="true"':''}
            aria-label="Câu ${n+1}${e.ans[q.id]?', đã trả lời':', chưa trả lời'}">${n+1}</button>`;
  }).join('')+'</div>';
}
function finish(){
  stopTimer();wake(false);store.set(EXKEY,null);
  const e=S.exam;e.done=true;
  let right=0,critBad=false;
  e.paper.forEach(q=>{const ok=e.ans[q.id]===q.answer;
    if(ok)right++;else if(q.critical)critBad=true;record(q.id,ok)});
  const wrongList=e.paper.filter(q=>e.ans[q.id]!==q.answer);
  const pass=right>=EXAM.pass&&!critBad, used=EXAM.minutes*60-left();
  S.screen='result';chrome('Kết quả');
  view(`
    <div class="score ${pass?'pass':'fail'}">
      <span class="badge">${pass?'ĐẠT':'CHƯA ĐẠT'}</span>
      <div class="big">${right}<span>/${EXAM.n}</span></div>
      <div class="sub">${critBad?'Sai câu điểm liệt — theo quy chế thi thật là trượt, dù các câu khác đúng.'
        :pass?`Chuẩn kỳ sát hạch thật luôn. Giỏi quá ${NAME} ơi 🎉`
        :`Cần đúng ít nhất ${EXAM.pass}/${EXAM.n} và không sai câu điểm liệt. Xem lại câu sai rồi thi tiếp nhé ${NAME} 💪`}</div>
    </div>
    <div class="stats">
      <div class="stat"><b>${right}</b><span>ĐÚNG</span></div>
      <div class="stat"><b style="color:var(--red)">${EXAM.n-right}</b><span>SAI</span></div>
      <div class="stat"><b>${mmss(used)}</b><span>THỜI GIAN</span></div>
    </div>
    <div class="lane"></div>
    <div class="grid">
      ${wrongList.length?`<button class="card rev" data-r="wrong"><span class="n">${wrongList.length}</span>
        <div class="t">Xem câu đã sai</div><div class="d">Đọc lại đáp án đúng của riêng những câu này</div></button>`:''}
      <button class="card book" data-r="all"><div class="t">Xem lại cả đề</div>
        <div class="d">Đối chiếu bài làm của bạn với đáp án, từng câu một</div></button>
      <button class="card dark" data-r="again"><div class="t">Thi đề khác</div>
        <div class="d">Bốc ${EXAM.n} câu mới, bấm giờ lại từ đầu</div></button>
    </div>`);
  const go=(s,f)=>{const el=$('view').querySelector(`[data-r="${s}"]`);if(el)el.onclick=f};
  go('wrong',()=>startStudy(wrongList,'Câu đã sai',e.ans));
  go('all',()=>startStudy(e.paper,'Xem lại đề',e.ans));
  go('again',startExam);
  nav(`<button class="btn" id="hm">Về trang chính</button>`);
  $('hm').onclick=home;
}

/* ── 화면 유지 · 복귀 처리 ── */
async function wake(on){
  try{
    if(on&&'wakeLock'in navigator&&!S.wake)S.wake=await navigator.wakeLock.request('screen');
    else if(!on&&S.wake){S.wake.release();S.wake=null}
  }catch{}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){saveExam();return}
  if(S.screen==='exam'&&S.exam&&!S.exam.done){left()<=0?finish():(tick(),wake(true))}
});
addEventListener('pagehide',saveExam);

/* 좌우 스와이프로 문항 이동 */
let tX=0,tY=0,tT=0;
$('view').addEventListener('touchstart',e=>{
  const t=e.changedTouches[0];
  // 화면 좌우 가장자리에서 시작한 제스처는 사파리 뒤로가기이므로 건드리지 않는다
  if(t.clientX<36||t.clientX>innerWidth-36){tT=0;return}
  tX=t.clientX;tY=t.clientY;tT=Date.now();
},{passive:true});
$('view').addEventListener('touchend',e=>{
  const t=e.changedTouches[0], dx=t.clientX-tX, dy=t.clientY-tY;
  if(!tT||Date.now()-tT>600||Math.abs(dx)<70||Math.abs(dy)>50)return;
  if(Math.abs(dx)<Math.abs(dy)*1.5)return;
  const back=dx>0;
  if(S.screen==='study'){
    const st=S.study;
    if(back){if(st.i>0){st.i--;drawStudy()}}
    else if(st.i<st.list.length-1){st.i++;drawStudy()}
  }else if(S.screen==='exam'&&!S.exam.done){
    const e2=S.exam;
    if(back){if(e2.i>0){e2.i--;saveExam();drawExam()}}
    else if(e2.i<EXAM.n-1){e2.i++;saveExam();drawExam()}
  }
},{passive:true});

/* 그림 탭하면 전체화면으로 */
$('view').addEventListener('click',e=>{
  const f=e.target.closest('.figure');if(!f)return;
  const src=f.querySelector('img')?.getAttribute('src');if(!src)return;
  const z=document.createElement('div');
  z.className='zoom';z.setAttribute('role','dialog');z.setAttribute('aria-modal','true');
  z.innerHTML=`<button type="button" aria-label="Đóng">×</button><img src="${src}" alt="Hình phóng to">`;
  const close=()=>{z.remove();f.focus()};
  z.onclick=close;
  z.addEventListener('keydown',ev=>{if(ev.key==='Escape')close()});
  document.body.appendChild(z);
  z.querySelector('button').focus();
});

$('back').onclick=()=>{
  if(S.screen==='exam'&&!S.exam.done){
    if(!confirm('Tạm dừng bài thi? Đồng hồ vẫn chạy, bạn có thể quay lại từ trang chính.'))return;
    saveExam();
  }
  stopTimer();wake(false);
  (S.screen==='study'&&S.study?.title?.startsWith('Chương'))?chapters():home();
};
boot();
</script>
