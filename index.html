<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn thi lý thuyết A1 — 250 câu</title>
<meta name="theme-color" content="#101418">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ── tokens ───────────────────────────────────────────────
   Palette borrowed from Vietnamese road signs, used semantically:
   cam (red)   = biển cấm  → điểm liệt / sai
   lenh (blue) = biển hiệu lệnh → hành động chính
   nguy (amber)= biển nguy hiểm → cần xem lại
   ─────────────────────────────────────────────────────── */
:root{
  --paper:#F7F5F0; --ink:#101418; --muted:#6B6F76; --line:#DEDAD1; --card:#FFFFFF;
  --cam:#D0021B; --lenh:#0B5FBF; --nguy:#E8A400; --ok:#127A4B;
  --r:14px; --pad:16px;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
     padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:var(--pad)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.2}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid var(--lenh);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.card,.opt{transition:transform .12s ease,border-color .12s ease}}

/* ── header ─────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
.back{font-size:22px;line-height:1;padding:4px 6px;margin-left:-6px}
.top h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.clock.low{color:var(--cam)}

/* ── home ───────────────────────────────────────────── */
.hero{padding:28px 0 20px}
.hero .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:34px;margin:8px 0 10px}
.hero p{margin:0;color:var(--muted);font-size:14px}
.rule{height:1px;background:var(--line);margin:20px 0}
.grid{display:grid;gap:12px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
      border-radius:var(--r);padding:18px}
.card:active{transform:scale(.99)}
.card .t{font-weight:800;font-size:18px}
.card .d{color:var(--muted);font-size:13px;margin-top:4px}
.card .n{float:right;font-family:var(--mono);font-size:13px;color:var(--muted)}
.card.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.card.primary .d,.card.primary .n{color:#B9BEC6}
.card.danger{border-color:var(--cam);border-width:2px}
.card.danger .t{color:var(--cam)}

/* ── question ───────────────────────────────────────── */
.qmeta{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px}
.tag{border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.tag.crit{color:#fff;background:var(--cam);border-color:var(--cam);font-weight:600}
.qtext{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.qimg{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:14px;display:block}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
     border-radius:12px;padding:14px}
.opt .k{font-family:var(--mono);font-weight:500;color:var(--muted);flex:none}
.opt.sel{border-color:var(--lenh);background:#F0F6FF}
.opt.sel .k{color:var(--lenh)}
.opt.right{border-color:var(--ok);background:#EFF8F3}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--cam);background:#FDF0F1}
.opt.wrong .k{color:var(--cam)}
.verdict{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:600}
.verdict.y{background:#EFF8F3;color:var(--ok)}
.verdict.n{background:#FDF0F1;color:var(--cam)}

/* ── nav / grid ─────────────────────────────────────── */
.navbar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 0 max(12px,env(safe-area-inset-bottom))}
.navbar .wrap{display:flex;gap:10px;padding-top:0;padding-bottom:0}
.btn{flex:1;border-radius:12px;padding:14px;font-weight:700;text-align:center;border:1.5px solid var(--line);background:var(--card)}
.btn.go{background:var(--lenh);border-color:var(--lenh);color:#fff}
.btn.fin{background:var(--ink);border-color:var(--ink);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:16px 0}
.dot{aspect-ratio:1;border:1.5px solid var(--line);border-radius:9px;background:var(--card);
     font-family:var(--mono);font-size:13px;display:grid;place-items:center}
.dot.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.dot.now{border-color:var(--lenh);border-width:2.5px}
.dot.crit{box-shadow:inset 0 0 0 2px var(--cam)}

/* ── result ─────────────────────────────────────────── */
.score{text-align:center;padding:30px 0 10px}
.score .big{font-family:var(--mono);font-size:66px;font-weight:500;line-height:1}
.score .lab{font-size:22px;font-weight:800;margin-top:6px}
.score.pass .lab{color:var(--ok)} .score.fail .lab{color:var(--cam)}
.score .sub{color:var(--muted);font-size:14px;margin-top:6px}

.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.err{border:1.5px solid var(--cam);background:#FDF0F1;border-radius:12px;padding:16px;font-size:14px}
.err code{font-family:var(--mono);font-size:13px}
</style>
</head>
<body>

<header class="top" id="top" hidden>
  <div class="wrap">
    <button class="back" id="back" aria-label="Quay lại">←</button>
    <h2 id="title"></h2>
    <span class="clock" id="clock" hidden></span>
  </div>
</header>

<main class="wrap" id="view"></main>
<nav class="navbar" id="nav" hidden><div class="wrap" id="navInner"></div></nav>

<script>
/* ══ storage (an toàn cả khi bị chặn) ══════════════════ */
const mem = {};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)) ?? mem[k] ?? null }catch{ return mem[k] ?? null } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)) }catch{} }
};

/* ══ dữ liệu ═══════════════════════════════════════════
   questions.json:
   { "meta":{...},
     "questions":[
       { "id":1, "chapter":1, "text":"...", "options":["...","..."],
         "answer":2,            // 1-based
         "critical":false,      // CÂU LIỆT
         "image":"img/q126.png" // hoặc null
       } ] }
   ═════════════════════════════════════════════════════ */
const CH = {
  1:{name:'Quy định chung & quy tắc giao thông', pick:8},
  2:{name:'Văn hóa giao thông, đạo đức lái xe',  pick:1},
  3:{name:'Kỹ thuật lái xe & cấu tạo sửa chữa',  pick:1},
  4:{name:'Báo hiệu đường bộ',                   pick:8},
  5:{name:'Sa hình & xử lý tình huống',          pick:6}
};
const EXAM = { n:25, pass:21, minutes:19 };

let QS = [];
const S = { screen:'home', stack:[], exam:null, study:null, timer:null };

async function boot(){
  try{
    const r = await fetch('questions.json',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    QS = (d.questions||[]).filter(q=>q && q.text && Array.isArray(q.options) && q.answer);
    if(!QS.length) throw new Error('Bộ câu hỏi trống');
    home();
  }catch(e){
    document.getElementById('view').innerHTML =
      `<div class="err"><b>Chưa tải được bộ câu hỏi.</b><br>
       Đặt tệp <code>questions.json</code> cạnh <code>index.html</code> rồi tải lại trang.<br><br>
       Chi tiết: <code>${String(e.message||e)}</code></div>`;
  }
}

/* ══ tiện ích ══════════════════════════════════════════ */
const byId = id => document.getElementById(id);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const wrongSet = () => new Set(store.get('wrong')||[]);
const markWrong = (id,bad) => { const s=wrongSet(); bad? s.add(id) : s.delete(id); store.set('wrong',[...s]); };
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function chrome(title,{back=true,clock=false}={}){
  byId('top').hidden=false; byId('title').textContent=title;
  byId('back').style.visibility = back?'visible':'hidden';
  byId('clock').hidden=!clock;
}
function nav(html){ const n=byId('nav'); if(!html){n.hidden=true;return;} n.hidden=false; byId('navInner').innerHTML=html; }

/* ══ màn hình chính ════════════════════════════════════ */
function home(){
  S.screen='home'; stopTimer(); byId('top').hidden=true; nav('');
  const w = wrongSet().size, crit = QS.filter(q=>q.critical).length;
  byId('view').innerHTML = `
    <section class="hero">
      <div class="kicker">Hạng A1 · A</div>
      <h1>Ôn thi lý thuyết lái xe mô tô</h1>
      <p>${QS.length} câu · đề thi ${EXAM.n} câu / ${EXAM.minutes} phút · đạt ${EXAM.pass}/${EXAM.n} và không sai câu điểm liệt</p>
    </section>
    <div class="rule"></div>
    <div class="grid">
      <button class="card primary" data-go="exam">
        <span class="n">${EXAM.minutes}′</span>
        <div class="t">Thi thử</div>
        <div class="d">Đề ngẫu nhiên đúng cấu trúc thi thật, có bấm giờ</div>
      </button>
      <button class="card danger" data-go="crit">
        <span class="n">${crit}</span>
        <div class="t">Câu điểm liệt</div>
        <div class="d">Sai một câu là trượt — học nhóm này trước</div>
      </button>
      <button class="card" data-go="study">
        <span class="n">${QS.length}</span>
        <div class="t">Học theo chương</div>
        <div class="d">Xem đáp án ngay sau khi chọn</div>
      </button>
      <button class="card" data-go="wrong">
        <span class="n">${w}</span>
        <div class="t">Câu đã làm sai</div>
        <div class="d">${w? 'Làm lại cho tới khi đúng' : 'Chưa có câu nào — làm thử một đề đi'}</div>
      </button>
    </div>`;
  byId('view').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.go;
    if(g==='exam') startExam();
    if(g==='crit') startStudy(QS.filter(q=>q.critical),'Câu điểm liệt');
    if(g==='study') chapters();
    if(g==='wrong'){ const s=wrongSet(); startStudy(QS.filter(q=>s.has(q.id)),'Câu đã làm sai'); }
  });
}

function chapters(){
  S.screen='chapters'; chrome('Học theo chương'); nav('');
  byId('view').innerHTML = '<div class="grid" style="padding-top:16px">' + Object.entries(CH).map(([k,v])=>{
    const n = QS.filter(q=>String(q.chapter)===k).length;
    return `<button class="card" data-ch="${k}"><span class="n">${n}</span>
            <div class="t">Chương ${k}</div><div class="d">${v.name}</div></button>`;
  }).join('') + '</div>';
  byId('view').querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ch;
    startStudy(QS.filter(q=>String(q.chapter)===k), 'Chương '+k);
  });
}

/* ══ chế độ học ════════════════════════════════════════ */
function startStudy(list,title){
  if(!list.length){
    S.screen='study'; chrome(title); nav('');
    byId('view').innerHTML='<div class="empty"><b>Không có câu nào ở đây.</b>Chọn mục khác ở trang chính.</div>';
    return;
  }
  S.study={list,i:0,title,picked:null}; S.screen='study'; drawStudy();
}
function drawStudy(){
  const st=S.study, q=st.list[st.i];
  chrome(`${st.title} · ${st.i+1}/${st.list.length}`);
  byId('view').innerHTML = qHTML(q, st.picked, true);
  byId('view').querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    if(st.picked) return;
    st.picked = +o.dataset.i;
    markWrong(q.id, st.picked!==q.answer);
    drawStudy();
  });
  nav(`<button class="btn" id="prev" ${st.i?'':'disabled'}>Câu trước</button>
       <button class="btn go" id="next">${st.i===st.list.length-1?'Xong':'Câu sau'}</button>`);
  byId('prev').onclick=()=>{ st.i--; st.picked=null; drawStudy(); };
  byId('next').onclick=()=>{ if(st.i===st.list.length-1) return home(); st.i++; st.picked=null; drawStudy(); };
}

function qHTML(q,picked,reveal){
  const opts = q.options.map((t,idx)=>{
    const i=idx+1; let cls='opt';
    if(picked){
      if(reveal && i===q.answer) cls+=' right';
      else if(i===picked) cls+=' wrong';
    }else if(i===picked) cls+=' sel';
    return `<button class="${cls}" data-i="${i}"><span class="k">${i}</span><span>${esc(t)}</span></button>`;
  }).join('');
  const verdict = (picked&&reveal)
    ? `<div class="verdict ${picked===q.answer?'y':'n'}">${picked===q.answer?'Đúng':'Sai — đáp án đúng là ý '+q.answer}</div>` : '';
  return `<div style="padding-top:16px">
      <div class="qmeta"><span class="tag">Câu ${q.id}</span>${q.critical?'<span class="tag crit">ĐIỂM LIỆT</span>':''}</div>
      <p class="qtext">${esc(q.text)}</p>
      ${q.image?`<img class="qimg" src="${q.image}" alt="Hình câu ${q.id}" loading="lazy">`:''}
      <div class="opts">${opts}</div>${verdict}
    </div>`;
}

/* ══ thi thử ═══════════════════════════════════════════ */
function buildPaper(){
  const crit = shuffle(QS.filter(q=>q.critical)).slice(0,1);
  const used = new Set(crit.map(q=>q.id));
  const paper = [...crit];
  for(const [k,v] of Object.entries(CH)){
    const pool = shuffle(QS.filter(q=>String(q.chapter)===k && !used.has(q.id)));
    for(const q of pool.slice(0,v.pick)){ paper.push(q); used.add(q.id); }
  }
  const rest = shuffle(QS.filter(q=>!used.has(q.id)));
  while(paper.length<EXAM.n && rest.length) paper.push(rest.pop());
  return shuffle(paper).slice(0,EXAM.n);
}
function startExam(){
  S.exam={paper:buildPaper(),ans:{},i:0,left:EXAM.minutes*60,done:false};
  S.screen='exam'; drawExam(); tick();
  S.timer=setInterval(()=>{ if(--S.exam.left<=0){ finish(); } else tick(); },1000);
}
function stopTimer(){ if(S.timer){clearInterval(S.timer);S.timer=null;} }
function tick(){
  const t=S.exam?.left ?? 0, c=byId('clock');
  c.textContent = String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  c.classList.toggle('low', t<=120);
}
function drawExam(){
  const e=S.exam, q=e.paper[e.i];
  chrome(`Câu ${e.i+1}/${EXAM.n}`,{clock:true});
  byId('view').innerHTML = qHTML(q, e.ans[q.id]||null, false) + dotsHTML();
  byId('view').querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ e.ans[q.id]=+o.dataset.i; drawExam(); });
  byId('view').querySelectorAll('.dot').forEach(d=>d.onclick=()=>{ e.i=+d.dataset.n; drawExam(); });
  const answered = Object.keys(e.ans).length;
  nav(`<button class="btn" id="prev" ${e.i?'':'disabled'}>Trước</button>
       ${e.i===EXAM.n-1
         ? `<button class="btn fin" id="fin">Nộp bài (${answered}/${EXAM.n})</button>`
         : `<button class="btn go" id="next">Sau</button>`}`);
  if(byId('prev')) byId('prev').onclick=()=>{e.i--;drawExam();};
  if(byId('next')) byId('next').onclick=()=>{e.i++;drawExam();};
  if(byId('fin'))  byId('fin').onclick=()=>{ if(confirm('Nộp bài bây giờ?')) finish(); };
}
function dotsHTML(){
  const e=S.exam;
  return '<div class="dots">'+e.paper.map((q,n)=>{
    let c='dot'; if(e.ans[q.id])c+=' done'; if(n===e.i)c+=' now'; if(q.critical)c+=' crit';
    return `<button class="${c}" data-n="${n}">${n+1}</button>`;
  }).join('')+'</div>';
}
function finish(){
  stopTimer(); const e=S.exam; e.done=true;
  let right=0, critBad=false;
  e.paper.forEach(q=>{
    const ok = e.ans[q.id]===q.answer;
    if(ok) right++; else { markWrong(q.id,true); if(q.critical) critBad=true; }
    if(ok) markWrong(q.id,false);
  });
  const pass = right>=EXAM.pass && !critBad;
  S.screen='result';
  chrome('Kết quả',{clock:false});
  byId('view').innerHTML = `
    <div class="score ${pass?'pass':'fail'}">
      <div class="big">${right}<span style="font-size:26px;color:var(--muted)">/${EXAM.n}</span></div>
      <div class="lab">${pass?'ĐẠT':'KHÔNG ĐẠT'}</div>
      <div class="sub">${critBad?'Sai câu điểm liệt — trượt ngay dù đúng bao nhiêu câu.'
                                :`Cần ${EXAM.pass}/${EXAM.n} và không sai câu điểm liệt.`}</div>
    </div>
    <div class="rule"></div>
    <div class="grid">
      <button class="card" data-r="review"><div class="t">Xem lại cả đề</div><div class="d">Đối chiếu từng câu với đáp án</div></button>
      <button class="card primary" data-r="again"><div class="t">Thi đề khác</div><div class="d">Bốc lại ${EXAM.n} câu mới</div></button>
    </div>`;
  byId('view').querySelector('[data-r="review"]').onclick=()=>startStudy(e.paper,'Xem lại đề');
  byId('view').querySelector('[data-r="again"]').onclick=startExam;
  nav(`<button class="btn" id="hm">Về trang chính</button>`);
  byId('hm').onclick=home;
}

/* ══ điều hướng ════════════════════════════════════════ */
byId('back').onclick=()=>{
  if(S.screen==='exam' && !S.exam.done && !confirm('Thoát bài thi? Kết quả sẽ không được lưu.')) return;
  stopTimer();
  S.screen==='study'&&S.study?.title?.startsWith('Chương') ? chapters() : home();
};
window.addEventListener('beforeunload',e=>{ if(S.screen==='exam'&&!S.exam.done){e.preventDefault();e.returnValue='';} });
boot();
</script>
</body>
</html>
